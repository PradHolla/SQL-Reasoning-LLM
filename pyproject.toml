[project]
name = "sql-reasoning-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.3.0",
    "fastapi>=0.141.1",
    "huggingface-hub>=1.6.0",
    "openai>=2.54.0",
    "sqlglot>=29.0.1",
    "torch>=2.10.0",
    "transformers>=5.2.0",
    "trl>=0.24.0",
    "unsloth>=2026.3.4",
    "uvicorn>=0.52.1",
    "wandb>=0.25.1",
]

[project.scripts]
eval = "sqlrl.eval.run_eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlrl"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
